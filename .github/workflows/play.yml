name: Play Store

# Pacchetto .aab di tk-desk per il Play Store, a ogni push su main.
# Stesso codice della versione Dropbox, compilato con TK_PLAY: niente aggiornamento da Dropbox, niente permesso
# di installare APK, niente «Offrimi un caffè». Stessa chiave di firma: chi ha l'app da Dropbox si aggiorna da Play.
# Il pacchetto parte da solo per Google Play (play_carica.py di tecnikgeek-repo/tk-app-store) se la versione è nuova.

on:
  # ogni push su main: lo store riceve qualcosa solo se il numero di versione in pubspec.yaml è nuovo
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-store
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      IMPRONTA_TKDESK: e294354deb7c9e49d4a9225c110c1d203cd59fd7bf9642e581d4df3d87bf37c7
      TK_PLAY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # storia completa: le note di rilascio vengono dai commit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, fissata al commit (ha accesso alla chiave di firma)
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=TK_PLAY=true

      - name: Chiave di firma dal segreto
        env:
          CHIAVE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$CHIAVE_B64" ]; then echo "::error::Segreto ANDROID_KEYSTORE_B64 mancante"; exit 1; fi
          printf '%s' "$CHIAVE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/tk.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/tk.keystore" >> "$GITHUB_ENV"

      - run: flutter build appbundle --release --dart-define=TK_PLAY=true --target-platform android-arm,android-arm64

      - name: Controlli del pacchetto
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | tee firma.txt
          TROVATA=$(grep -m1 'SHA256:' firma.txt | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$TROVATA" != "$IMPRONTA_TKDESK" ]; then echo "::error::Il pacchetto non è firmato con la chiave di tk-desk"; exit 1; fi
          echo "Firma giusta: è la chiave di tk-desk"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > manifest.pb
          if grep -q REQUEST_INSTALL_PACKAGES manifest.pb; then echo "::error::Il permesso di installare APK è ancora nel pacchetto"; exit 1; fi
          echo "Permesso di installare APK assente"
          if grep -qE 'READ_MEDIA_(IMAGES|VIDEO|AUDIO)|READ_EXTERNAL_STORAGE' manifest.pb; then echo "::error::Permessi su foto e video ancora nel pacchetto (Play li vuole solo per le gallerie)"; exit 1; fi
          echo "Permessi su foto, video e audio assenti"
          python3 tools/controlla_16kb.py "$AAB"
          VERSIONE=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' \r')
          mkdir -p dist && cp "$AAB" "dist/tk-desk-${VERSIONE%%+*}-play.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: tkdesk-aab
          path: dist/*.aab
          retention-days: 14

      - name: Pubblicazione su Google Play
        env:
          PLAY_JSON: ${{ secrets.PLAY_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "::error::Segreto PLAY_JSON mancante"; exit 1; fi
          git clone -q --depth 1 https://github.com/tecnikgeek-repo/tk-app-store "$RUNNER_TEMP/tk-app-store"
          pip install -q pyjwt cryptography
          VERSIONE=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          NOTE=$(python3 "$RUNNER_TEMP/tk-app-store/note.py" 500)
          TK_VERSIONE="${VERSIONE%%+*}" python3 "$RUNNER_TEMP/tk-app-store/play_carica.py" it.pietrodefilippis.tkdesk dist/*.aab "$NOTE"
